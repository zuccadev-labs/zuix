<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pricing preview</title>
    <!-- Página de ejemplo para WebPreview (pantalla Studio): estática, sin scripts ni recursos de red. -->
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 32px 24px; line-height: 1.5; }
      .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
      .plan { padding: 16px; border: 1px solid GrayText; border-radius: 12px; }
      h1 { margin-block-start: 0; }
    </style>
  </head>
  <body>
    <h1>Pricing</h1>
    <p>Pick the plan that fits your team.</p>
    <div class="plans">
      <section class="plan"><h2>Starter</h2><p>Free for small projects.</p></section>
      <section class="plan"><h2>Team</h2><p>Shared workspaces and roles.</p></section>
      <section class="plan"><h2>Enterprise</h2><p>Single sign-on and audit logs.</p></section>
    </div>
  </body>
</html>
