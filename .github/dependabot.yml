# Actualizaciones semanales, agrupadas para no abrir un pull request por dependencia.
# `cooldown`: Dependabot no propone una versión hasta siete días después de publicada (las de seguridad no
# esperan). pnpm aplica además su propia antigüedad mínima al instalar (pnpm-workspace.yaml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: deps
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@easyops-cn/docusaurus-search-local"
          - "@mdx-js/*"
          - prism-react-renderer
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      herramientas:
        patterns:
          - typescript
          - esbuild
          - vite
          - "@vitejs/*"
          - playwright-core
          - axe-core
          - "@biomejs/*"
          - happy-dom
          - tsx
      resto-menores:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      acciones:
        patterns:
          - "*"
