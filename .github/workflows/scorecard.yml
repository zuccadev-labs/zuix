# OpenSSF Scorecard: evalúa las prácticas de seguridad del repositorio (acciones fijadas, permisos, protección
# de ramas, publicación firmada…). Los resultados se publican en scorecard.dev y quedan como artefacto.
# No se suben a Code scanning: esa pestaña es para vulnerabilidades del código que se corrigen con un cambio, y
# varias comprobaciones de Scorecard miden el proyecto, no el código (antigüedad del repositorio, revisión por
# otra persona, insignia de buenas prácticas). Ver docs/development/03-ci-y-cadena-de-suministro.md.
# `publish_results` impone restricciones a este archivo (github.com/ossf/scorecard-action#workflow-restrictions):
# sin permisos de escritura globales y solo con las acciones de abajo.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard
    # Un fork no publica resultados con el nombre de este repositorio.
    if: github.repository == 'zuccadev-labs/zuix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # firmar los resultados que se publican en scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          if-no-files-found: error
          path: results.sarif
          retention-days: 30
