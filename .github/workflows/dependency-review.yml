# Revisión de dependencias en cada pull request: falla si el cambio introduce una dependencia con un aviso de
# seguridad de gravedad moderada o superior, o con una licencia incompatible con la distribución bajo MIT.
# No comenta en el pull request (no necesita permiso de escritura): el resumen queda en la ejecución.
name: dependency-review

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: Revisión de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Copyleft fuerte: no entra ni en los paquetes ni en las herramientas sin una decisión expresa.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: never
