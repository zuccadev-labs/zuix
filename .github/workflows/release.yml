# Publicación automática en npm de los cinco paquetes de la suite: @zuccadev-labs/zuix-tokens, -zicon, -zui, -zout y el
# paraguas @zuccadev-labs/zuix (carpeta suite/). Procedimiento y configuración: docs/package/02-publicacion.md.
#
#   Push a main          `detect` compara la versión de cada paquete con el registro. Si todas están publicadas, termina
#                        en verde sin hacer nada más. Si falta alguna: verifica (ci.yml), publica las que faltan en orden
#                        y crea la etiqueta vX.Y.Z y el GitHub Release.
#   Ejecución manual     Lo mismo, como ensayo (`npm publish --dry-run`) por defecto. Sin "dry-run" publica, y solo
#                        desde main.
#
# Subir la versión (`pnpm bump`) y fusionar en main es lo que publica. No hay disparo por etiqueta: la etiqueta la crea
# este workflow después de publicar, con GITHUB_TOKEN, y no lanza otra ejecución.
#
# Autenticación: publicación de confianza de npm (OIDC). No hay token de larga duración y la procedencia es automática.
# npm exige: npm >= 11.5.1 y Node >= 22.14, runner alojado por GitHub, `id-token: write`, y que el workflow (release.yml),
# el entorno (npm) y `repository.url` de cada paquete coincidan con lo registrado en npmjs.com. El trabajo que publica
# está en este archivo y no en un workflow reutilizable: npm valida el workflow que llama.
# No hay vía con token: si la publicación de confianza falla, el respaldo es la publicación manual con 2FA
# (docs/package/02-publicacion.md). npm recomienda además prohibir los tokens en cada paquete.
#
# Se publican los tarballs de `pnpm pack` que probó `pnpm test:pack` (artefacto `tarballs` de ci.yml), nunca una carpeta.
# `publish` no descarga el repositorio ni instala dependencias: solo los tarballs y npm. Después de publicar,
# `attest` firma la procedencia de esos mismos tarballs (attestations de GitHub, verificables con
# `gh attestation verify`) y `release` los adjunta al GitHub Release con sus huellas y su SBOM.
#
# Endurecimiento: acciones fijadas por SHA completo, `permissions: {}` por defecto y permisos por trabajo, sin
# cachés en ningún trabajo (la verificación se llama con `release: true`), y ninguna expresión `${{ }}` en un `run:`.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Ensayo. No sube nada al registro ni crea la etiqueta
        type: boolean
        default: true
      dist-tag:
        description: Etiqueta de distribución de npm. Vacío = latest, o next si la versión es preliminar
        type: string
        default: ""

# Una publicación en curso no se cancela: la siguiente ejecución espera y vuelve a consultar el registro.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  detect:
    name: Detectar versiones sin publicar
    # Un fork no publica.
    if: github.repository == 'zuccadev-labs/zuix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.detect.outputs.pending }}
      version: ${{ steps.detect.outputs.version }}
      dry-run: ${{ steps.detect.outputs.dry-run }}
      dist-tag: ${{ steps.detect.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comparar las versiones con el registro
        id: detect
        env:
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          INPUT_DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          set -euo pipefail
          node tools/version.mjs check
          version="$(node -p "require('./tokens/package.json').version")"

          dry_run=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" != "false" ]; then dry_run=true; fi
          if [ "$dry_run" = "false" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Solo se publica desde main, no desde $GITHUB_REF. Desde otra rama solo vale el ensayo."
            exit 1
          fi

          dist_tag="${INPUT_DIST_TAG:-}"
          if [ -z "$dist_tag" ]; then
            case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          fi
          case "$dist_tag" in
            *[!a-z0-9.-]*|[0-9]*) echo "::error::dist-tag no válido: $dist_tag"; exit 1 ;;
          esac

          # `latest` es lo que instala `npm install` sin versión: ni una preliminar ni una versión anterior a la actual.
          if [ "$dist_tag" = "latest" ]; then
            case "$version" in *-*) echo "::error::$version es preliminar: no puede publicarse como latest."; exit 1 ;; esac
          fi

          pending=""
          for dir in tokens zicon zui zout suite; do
            name="$(node -p "require('./$dir/package.json').name")"
            v="$(node -p "require('./$dir/package.json').version")"
            if [ "$dist_tag" = "latest" ]; then
              current="$(npm view "$name" dist-tags.latest 2>/dev/null || true)"
              if [ -n "$current" ] && ! CURRENT="$current" NEXT="$v" node -e '
                const parts = (s) => s.split("-")[0].split(".").map(Number);
                const [next, current] = [parts(process.env.NEXT), parts(process.env.CURRENT)];
                for (let i = 0; i < 3; i++) if (next[i] !== current[i]) process.exit(next[i] > current[i] ? 0 : 1);
              '; then
                echo "::error::$name: latest es $current y $v es anterior. Publicarla movería latest hacia atrás; usa otra dist-tag."
                exit 1
              fi
            fi
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then
              echo "::error::$dir está marcado como privado."; exit 1
            fi
            # Publicada: npm devuelve la versión. Sin publicar: E404 (o salida vacía en un npm antiguo).
            # Cualquier otro fallo (red, registro caído) detiene la ejecución en vez de darla por no publicada.
            status=0
            out="$(npm view "$name@$v" version 2>"$RUNNER_TEMP/npm-view.err")" || status=$?
            if [ "$status" -eq 0 ] && [ "$out" = "$v" ]; then
              echo "$name@$v ya está en el registro."
            elif grep -q 'E404' "$RUNNER_TEMP/npm-view.err" || { [ "$status" -eq 0 ] && [ -z "$out" ]; }; then
              echo "$name@$v no está en el registro: pendiente."
              pending="$pending $dir"
            else
              echo "::error::No se pudo consultar $name@$v en el registro."
              cat "$RUNNER_TEMP/npm-view.err"
              exit 1
            fi
          done
          pending="${pending# }"

          {
            echo "pending=$pending"
            echo "version=$version"
            echo "dry-run=$dry_run"
            echo "dist-tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$pending" ]; then
            echo "Nada que publicar: la versión $version de los cinco paquetes ya está en el registro." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Versión $version pendiente en: $pending (dist-tag $dist_tag, ensayo: $dry_run)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # La misma verificación que el ci de cada cambio, sin cachés. Deja los artefactos `tarballs` y `sbom`.
  verify:
    name: Verificación
    needs: detect
    if: needs.detect.outputs.pending != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  # Ensayo: sin entorno, sin credenciales y desde cualquier rama.
  rehearse:
    name: Ensayo (no publica)
    needs: [detect, verify]
    if: needs.detect.outputs.dry-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      DRY_RUN: "true"
      VERSION: ${{ needs.detect.outputs.version }}
      DIST_TAG: ${{ needs.detect.outputs.dist-tag }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: pack
      # El mismo guion que el paso "Publicar" de `publish`: se mantienen idénticos.
      - name: Ensayar la publicación
        run: |
          set -euo pipefail
          # Los tarballs son los que empaquetó y probó `verify`: sus huellas coinciden con las que dejó.
          (cd pack && sha256sum --check --strict SHA256SUMS)
          published=""
          for dir in tokens zicon zui zout suite; do
            case "$dir" in suite) name="@zuccadev-labs/zuix" ;; *) name="@zuccadev-labs/zuix-$dir" ;; esac
            # Con "./": sin él, npm toma "pack/archivo.tgz" por un repositorio de GitHub (usuario/repo).
            file="./pack/$(printf '%s' "${name#@}" | tr / -)-$VERSION.tgz"
            if [ ! -f "$file" ]; then echo "::error::Falta el tarball $file."; exit 1; fi
            # El tarball es el de este paquete y esta versión, y es publicable.
            tar -xzOf "$file" package/package.json | NAME="$name" node -e '
              const m = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const bad = [];
              if (m.name !== process.env.NAME) bad.push(`nombre ${m.name}`);
              if (m.version !== process.env.VERSION) bad.push(`versión ${m.version}`);
              if (m.private) bad.push("privado");
              if (JSON.stringify(m).includes("workspace:")) bad.push("rangos workspace: sin resolver");
              if (bad.length) { console.error(`::error::${process.env.NAME}: tarball no publicable (${bad.join(", ")}).`); process.exit(1); }
            '
            # Una versión que ya está en el registro se salta: la ejecución se puede repetir si se quedó a medias.
            # Cualquier fallo que no sea "no existe" (E404) detiene la ejecución.
            status=0
            out="$(npm view "$name@$VERSION" version 2>"$RUNNER_TEMP/npm-view.err")" || status=$?
            if [ "$status" -eq 0 ] && [ "$out" = "$VERSION" ]; then
              echo "$name@$VERSION ya está publicado: se salta."
              continue
            elif ! grep -q 'E404' "$RUNNER_TEMP/npm-view.err" && ! { [ "$status" -eq 0 ] && [ -z "$out" ]; }; then
              echo "::error::No se pudo consultar $name@$VERSION en el registro."
              cat "$RUNNER_TEMP/npm-view.err"
              exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "Ensayo de $name@$VERSION (dist-tag $DIST_TAG): no se sube nada."
              npm publish "$file" --access public --tag "$DIST_TAG" --dry-run
            else
              npm publish "$file" --access public --tag "$DIST_TAG"
              published="$published $name@$VERSION"
            fi
          done
          echo "published=${published# }" >> "$GITHUB_OUTPUT"
          echo "Publicado: ${published:- nada}" | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publicación en npm
    needs: [detect, verify]
    if: needs.detect.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Entorno de GitHub limitado a main. Su nombre forma parte de la publicación de confianza registrada en npmjs.com.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@zuccadev-labs/zuix/v/${{ needs.detect.outputs.version }}
    permissions:
      id-token: write # OIDC: autentica la publicación en npm y firma su procedencia. Sin más permisos ni secretos.
    env:
      DRY_RUN: "false"
      VERSION: ${{ needs.detect.outputs.version }}
      DIST_TAG: ${{ needs.detect.outputs.dist-tag }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: npm admite la publicación de confianza
        run: |
          set -euo pipefail
          node -e '
            const atLeast = (have, want) => { const a = have.split(".").map(Number), b = want.split(".").map(Number); for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) return a[i] > b[i]; } return true; };
            const npm = require("child_process").execSync("npm --version", { encoding: "utf8" }).trim();
            const node = process.versions.node;
            console.log(`node ${node}, npm ${npm}`);
            if (!atLeast(node, "22.14.0") || !atLeast(npm, "11.5.1")) { console.error("::error::La publicación de confianza exige Node >= 22.14.0 y npm >= 11.5.1."); process.exit(1); }
          '
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: pack
      # El mismo guion que el paso "Ensayar la publicación" de `rehearse`: se mantienen idénticos.
      - name: Publicar
        id: publish
        run: |
          set -euo pipefail
          # Los tarballs son los que empaquetó y probó `verify`: sus huellas coinciden con las que dejó.
          (cd pack && sha256sum --check --strict SHA256SUMS)
          published=""
          for dir in tokens zicon zui zout suite; do
            case "$dir" in suite) name="@zuccadev-labs/zuix" ;; *) name="@zuccadev-labs/zuix-$dir" ;; esac
            # Con "./": sin él, npm toma "pack/archivo.tgz" por un repositorio de GitHub (usuario/repo).
            file="./pack/$(printf '%s' "${name#@}" | tr / -)-$VERSION.tgz"
            if [ ! -f "$file" ]; then echo "::error::Falta el tarball $file."; exit 1; fi
            # El tarball es el de este paquete y esta versión, y es publicable.
            tar -xzOf "$file" package/package.json | NAME="$name" node -e '
              const m = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const bad = [];
              if (m.name !== process.env.NAME) bad.push(`nombre ${m.name}`);
              if (m.version !== process.env.VERSION) bad.push(`versión ${m.version}`);
              if (m.private) bad.push("privado");
              if (JSON.stringify(m).includes("workspace:")) bad.push("rangos workspace: sin resolver");
              if (bad.length) { console.error(`::error::${process.env.NAME}: tarball no publicable (${bad.join(", ")}).`); process.exit(1); }
            '
            # Una versión que ya está en el registro se salta: la ejecución se puede repetir si se quedó a medias.
            # Cualquier fallo que no sea "no existe" (E404) detiene la ejecución.
            status=0
            out="$(npm view "$name@$VERSION" version 2>"$RUNNER_TEMP/npm-view.err")" || status=$?
            if [ "$status" -eq 0 ] && [ "$out" = "$VERSION" ]; then
              echo "$name@$VERSION ya está publicado: se salta."
              continue
            elif ! grep -q 'E404' "$RUNNER_TEMP/npm-view.err" && ! { [ "$status" -eq 0 ] && [ -z "$out" ]; }; then
              echo "::error::No se pudo consultar $name@$VERSION en el registro."
              cat "$RUNNER_TEMP/npm-view.err"
              exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "Ensayo de $name@$VERSION (dist-tag $DIST_TAG): no se sube nada."
              npm publish "$file" --access public --tag "$DIST_TAG" --dry-run
            else
              npm publish "$file" --access public --tag "$DIST_TAG"
              published="$published $name@$VERSION"
            fi
          done
          echo "published=${published# }" >> "$GITHUB_OUTPUT"
          echo "Publicado: ${published:- nada}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Procedencia de los tarballs publicados (SLSA, firmada con Sigstore y guardada en GitHub).
  # Se comprueba con: gh attestation verify <tarball> --repo zuccadev-labs/zuix
  attest:
    name: Attestations de los tarballs
    needs: [detect, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # certificado de firma de Sigstore
      attestations: write # guardar la attestation en el repositorio
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: pack
      - run: cd pack && sha256sum --check --strict SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: pack/*.tgz

  # Etiqueta y GitHub Release sobre el commit publicado, con los cinco tarballs, sus huellas y el SBOM de cada
  # paquete. La etiqueta se crea por la API con GITHUB_TOKEN: no dispara workflows, y este solo escucha pushes a main.
  release:
    name: Etiqueta y GitHub Release
    needs: [detect, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # crear la etiqueta vX.Y.Z y el Release
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/assets
      - name: Notas desde los CHANGELOG
        run: |
          set -euo pipefail
          node -e '
            const { readFileSync, writeFileSync } = require("fs");
            const version = process.env.VERSION;
            const packages = [["tokens", "@zuccadev-labs/zuix-tokens"], ["zicon", "@zuccadev-labs/zuix-zicon"], ["zui", "@zuccadev-labs/zuix-zui"], ["zout", "@zuccadev-labs/zuix-zout"], ["suite", "@zuccadev-labs/zuix"]];
            const out = [`Versión ${version} de la suite. Los cinco paquetes comparten número.`, "", "| Paquete | npm |", "|---|---|"];
            for (const [, name] of packages) out.push(`| \`${name}\` | [${version}](https://www.npmjs.com/package/${name}/v/${version}) |`);
            out.push("", "```", `npm install @zuccadev-labs/zuix@${version}`, "```");
            for (const [dir, name] of packages) {
              const log = readFileSync(`${dir}/CHANGELOG.md`, "utf8");
              const start = log.indexOf(`\n## [${version}]`);
              if (start < 0) { console.error(`::error::${dir}/CHANGELOG.md no tiene la entrada [${version}].`); process.exit(1); }
              const bodyStart = log.indexOf("\n", start + 1);
              const end = log.indexOf("\n## [", bodyStart);
              // Los títulos de sección del CHANGELOG (###) bajan un nivel bajo el título del paquete.
              const body = log.slice(bodyStart, end < 0 ? log.length : end).trim().replace(/^###/gm, "####");
              out.push("", `## ${name}`, "", body);
            }
            writeFileSync(process.env.NOTES, out.join("\n") + "\n");
          '
        env:
          NOTES: ${{ runner.temp }}/release-notes.md
      - name: Crear la etiqueta y el Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ runner.temp }}/release-notes.md
          ASSETS: ${{ runner.temp }}/assets
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "El Release $tag ya existe: no se toca."
            exit 0
          fi
          # Una etiqueta previa solo vale si apunta al commit publicado: el Release no se crea sobre otro código.
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null)"; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::La etiqueta $tag ya existe y apunta a $existing, no al commit publicado ($GITHUB_SHA)."
              exit 1
            fi
            echo "::warning::La etiqueta $tag ya existía sobre este commit: el Release se crea sobre ella."
          fi
          (cd "$ASSETS" && sha256sum --check --strict SHA256SUMS)
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "zuix $VERSION" --notes-file "$NOTES" "${prerelease[@]}" \
            "$ASSETS"/*.tgz "$ASSETS"/SHA256SUMS "$ASSETS"/*.cdx.json
